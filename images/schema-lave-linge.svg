<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 459" width="612" height="459">
  <title>Raccordement d’un lave-linge : robinet d’arrêt, flexible d’alimentation et évacuation en siphon</title>
  <defs>
    <pattern id="trame" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#e2e8ee" stroke-width="1"/>
    </pattern>
    <marker id="sens" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1658c4"/>
    </marker>
  </defs>
  <rect width="612" height="459" fill="#ffffff"/>
  <rect width="612" height="459" fill="url(#trame)"/>

  <!-- Mur et sol -->
  <path d="M60 60V400H560" fill="none" stroke="#1b2127" stroke-width="2.4"/>

  <!-- Lave-linge -->
  <path d="M300 150H520V400H300Z" fill="#ffffff" stroke="#1b2127" stroke-width="1.8"/>
  <path d="M300 186H520" stroke="#1b2127" stroke-width="1.2"/>
  <circle cx="410" cy="290" r="66" fill="#f1f4f7" stroke="#1b2127" stroke-width="1.6"/>
  <circle cx="410" cy="290" r="46" fill="none" stroke="#c7d0d8" stroke-width="1.2"/>
  <path d="M480 166H500" stroke="#1b2127" stroke-width="3" stroke-linecap="round"/>

  <!-- Alimentation : arrivée au mur, robinet d'arrêt, flexible -->
  <path d="M60 120H130" stroke="#1658c4" stroke-width="4" stroke-linecap="round" marker-end="url(#sens)"/>
  <path d="M130 106L154 134V106L130 134Z" fill="#ffffff" stroke="#1b2127" stroke-width="1.6"/>
  <path d="M142 106V90M132 90H152" stroke="#1b2127" stroke-width="1.6"/>
  <path d="M154 120C230 120 250 168 300 168" fill="none" stroke="#1658c4" stroke-width="4" stroke-linecap="round"/>

  <!-- Évacuation : tuyau de vidange dans un siphon mural -->
  <path d="M300 220C240 220 210 214 196 200V180" fill="none" stroke="#46515c" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 9"/>
  <path d="M184 180H208V250A12 12 0 0 1 184 250Z" fill="#ffffff" stroke="#1b2127" stroke-width="1.6"/>
  <path d="M196 262V300H60" fill="none" stroke="#46515c" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 9"/>

  <g font-family="Arial Narrow, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#1b2127">
    <g stroke="#1b2127" stroke-width="1" fill="none">
      <path d="M142 90V56H176"/>
      <path d="M184 230H120V250H96"/>
      <path d="M232 150V92H272"/>
      <path d="M480 166V120H500"/>
    </g>
    <circle cx="184" cy="230" r="3"/>
    <circle cx="232" cy="150" r="3"/>
    <circle cx="480" cy="166" r="3"/>
    <text x="182" y="60">ROBINET D’ARRÊT</text>
    <text x="72" y="270">SIPHON MURAL</text>
    <text x="278" y="96">FLEXIBLE</text>
    <text x="506" y="124">LAVE-LINGE</text>
    <text x="68" y="150" fill="#1658c4">EAU FROIDE</text>
    <text x="68" y="324" fill="#46515c">ÉVACUATION</text>
  </g>
</svg>
