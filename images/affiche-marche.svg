<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <title>Cagette de tomates et de citrons du marché, dessin à plat façon affiche</title>
  <!-- Ombre portée au sol -->
  <ellipse cx="200" cy="430" rx="170" ry="18" fill="#10203d" opacity="0.18"/>
  <!-- Fruits qui dépassent de la cagette -->
  <circle cx="118" cy="250" r="46" fill="#b8432a"/>
  <circle cx="200" cy="232" r="52" fill="#d4573a"/>
  <circle cx="282" cy="252" r="44" fill="#b8432a"/>
  <circle cx="158" cy="210" r="34" fill="#f4b41a"/>
  <circle cx="250" cy="206" r="32" fill="#f4b41a"/>
  <!-- Pédoncules et feuilles -->
  <path d="M200 182c-6-16 4-28 18-30-2 14-8 24-18 30z" fill="#1f5a3f"/>
  <path d="M200 182c8-14 22-18 34-12-10 10-22 14-34 12z" fill="#2c7350"/>
  <path d="M118 206c-4-12 4-22 14-24-2 10-6 18-14 24z" fill="#1f5a3f"/>
  <path d="M282 210c4-12 16-16 26-12-8 8-18 12-26 12z" fill="#1f5a3f"/>
  <!-- Reflets -->
  <circle cx="186" cy="214" r="10" fill="#ffffff" opacity="0.35"/>
  <circle cx="104" cy="234" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="270" cy="236" r="8" fill="#ffffff" opacity="0.3"/>
  <!-- Cagette en bois -->
  <rect x="40" y="270" width="320" height="150" fill="#e9c98a"/>
  <rect x="40" y="270" width="320" height="22" fill="#d9b06a"/>
  <rect x="40" y="326" width="320" height="22" fill="#d9b06a"/>
  <rect x="40" y="382" width="320" height="22" fill="#d9b06a"/>
  <rect x="40" y="270" width="18" height="150" fill="#c99a52"/>
  <rect x="342" y="270" width="18" height="150" fill="#c99a52"/>
  <!-- Étiquette de la cagette -->
  <rect x="150" y="300" width="100" height="50" fill="#fffdf7"/>
  <text x="200" y="324" text-anchor="middle" font-family="Josefin Sans, Futura, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#10203d">MARCHÉ</text>
  <text x="200" y="342" text-anchor="middle" font-family="Josefin Sans, Futura, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#b8432a">DU MATIN</text>
</svg>
